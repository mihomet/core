name: Build core

on:
  workflow_dispatch:
  push:
    tags: ['core-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build patched cores
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_API: '26'
        run: ./core-build/build-core.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmihomo-cores
          path: |
            core-build/dist/libmihomo-*.so
            core-build/dist/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/core-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core-build/dist/libmihomo-*.so
            core-build/dist/SHA256SUMS
