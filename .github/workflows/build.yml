name: Build core

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Stable upstream tag (empty = latest stable release)'
        type: string
        default: ''
      publish:
        description: 'Publish only after all ABI and Android smoke checks pass'
        type: boolean
        default: false
  push:
    tags: ['core-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.upstream.outputs.build }}
      publish: ${{ steps.upstream.outputs.publish }}
      upstream: ${{ steps.upstream.outputs.upstream }}
      commit: ${{ steps.upstream.outputs.commit }}
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test release resolution and artifact verifier
        run: python3 -m unittest discover -s core-build -p 'test_*.py' -v
      - name: Resolve immutable stable upstream
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: python3 core-build/upstream.py resolve

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream }}
      UPSTREAM_COMMIT: ${{ needs.resolve.outputs.commit }}
      CORE_VERSION: ${{ needs.resolve.outputs.version }}
      CORE_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      ANDROID_API: '26'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f # v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build patched cores
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./core-build/build-core.sh
      - name: Verify ABI hashes sizes architectures and release version
        run: python3 core-build/upstream.py verify core-build/dist "$CORE_RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libmihomo-cores
          if-no-files-found: error
          path: |
            core-build/dist/libmihomo-*.so
            core-build/dist/SHA256SUMS
            core-build/dist/manifest.json

  smoke-apk:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mihomet/mihomet
          ref: v1.3.8
          path: smoke-app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libmihomo-cores
          path: core-build/dist
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Inject verified candidate only in the smoke checkout
        run: python3 core-build/prepare-smoke-app.py core-build/dist smoke-app
      - name: Build smoke APKs
        working-directory: smoke-app
        run: ./gradlew assembleDebug assembleDebugAndroidTest --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-smoke-apks
          if-no-files-found: error
          path: |
            smoke-app/app/build/outputs/apk/debug/app-x86_64-debug.apk
            smoke-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  smoke:
    needs: smoke-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-smoke-apks
          path: smoke-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android bundled-core and app integration tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 core-build/run-smoke.py smoke-apks
      - name: Upload device output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-smoke-api-${{ matrix.api }}
          path: core-smoke.log

  publish:
    needs: [resolve, build, smoke-apk, smoke]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CORE_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libmihomo-cores
          path: core-build/dist
      - name: Sign manifest after the Android checks
        env:
          CORE_MANIFEST_KEY_PEM: ${{ secrets.CORE_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          test -n "$CORE_MANIFEST_KEY_PEM" || { echo '::error::CORE_MANIFEST_KEY is required'; exit 1; }
          SIGNING_FILE="$RUNNER_TEMP/core-manifest-key.pem"
          trap 'rm -f "$SIGNING_FILE"' EXIT
          umask 077
          printf '%s\n' "$CORE_MANIFEST_KEY_PEM" > "$SIGNING_FILE"
          openssl dgst -sha256 -sign "$SIGNING_FILE" -out core-build/dist/manifest.json.sig core-build/dist/manifest.json
          REQUIRE_SIGNATURE=true python3 core-build/upstream.py verify core-build/dist "$CORE_RELEASE_TAG"
      - name: Publish immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 core-build/publish.py "$CORE_RELEASE_TAG"
